<!DOCTYPE html>
<html lang="en">
<body>
    <h2>JavaScript Arrays Methods</h2>
    <h2>join() and pop()</h2>
    <p id="myjoin"></p>
    <p id="mypop"></p>
    <p id="mysecond"></p>
    <script>
        var parts = ["Engine", "Turbo", "Exhaust", "Wheels"];
        document.getElementById("myjoin").innerHTML = parts.join(" _ ");
        document.getElementById("mypop").innerHTML = parts.pop();
        document.getElementById("mysecond").innerHTML = parts;
    </script>
</body>
</html>
