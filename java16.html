<!DOCTYPE html>
<html lang="en">
<head>
    <title>MY COMPUTER</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h2>MY COMPUTER</h2>
    <p>This is a webpage on components of my computer.</p>

    <div id="components">
        <h3>Components:</h3>
        <div class="zone">Central Processing Unit<span id="info"></span></div>
        <div class="zone">Random Access Memory<span id="ram"></span></div>
        <div class="zone">Storage Device<span id="storage"></span></div>
        <div class="zone">Motherboard<span id="processing"></span></div>
        <div class="zone">Power Supply<span id="power"></span></div>
        <div class="zone">TOTAL COMPONENTS: <span id="total">5</span></div>
    </div>

    <br>   
    
    <button onclick="checkComponents()">Check up the Laptop Components</button>

    <p class="components"></p>

    <script>
        function checkComponents() {
            document.getElementById('info').innerHTML= "Component 1: Central Processing Unit";
            document.getElementById('ram').innerHTML= "Component 2: Random Access Memory";
            document.getElementById('storage').innerHTML= "Component 3: Storage Device";
            document.getElementById('processing').innerHTML= "Component 4: Motherboard";
            document.getElementById('power').innerHTML= "Component 5: Power Supply";
            document.getElementById('total').innerHTML= "5";
            document.getElementById('components').style.backgroundColor = "yellow";
            document.getElementById('components').innerHTML = document.title + " All components are checked and verified.";

        }   

    </script>
    <style>
        body {
            background-color: rgb(21, 148, 190);
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            text-align: center;
        }
        h1, h2, h3 {
            color: #128b07;
            font-weight: bold;
        }
        #components {
            background-color: #9819b8;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #ff0000;
            font-weight: bold;
        }
        .zone {
            margin-bottom: 10px;
            font-size: 18px;
            color: #ffffff;
            border: 2px solid #f1ee10;
            border-radius: 10px;
            padding: 10px;
        }
        button {
            background-color: #4e8080;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 10px;
            color: #000000;
        }
    </style>
</body>
<h1>My Computer</h1>
<p>This is a webpage on components of my computer!</p>
</html>
