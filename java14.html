<!DOCTYPE html>
<html lang="en">
<body>
    <h2>JavaScript Functions</h2>
    <p>Do a calculation and return the result.</p>
    <p id="demo"></p>
    <script>
        function myFunction(a, b) {
            return a * b;
        }
        function mean(a, b) {
            return (a + b) / 2;
        }
        let result = mean(10, 20);
        document.getElementById("demo").innerHTML = myFunction(5, 3) + "<br>" + result;
    </script>
</body>
</html>
