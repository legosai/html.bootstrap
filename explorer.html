<!DOCTYPE html>
<html lang="en">
<head>
    <title>File Explorer</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1b64ad; padding: 20px;}
        .navbar { background-color: #630886; padding: 10px; margin-bottom: 20px; }
        .navbar-brand, .nav-link {color: #fff;}
        .section-title { color: #09f11d; margin: 20px 0 10px; padding: 10px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-light">
        <a class="navbar-brand" href="#">File Explorer</a>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="#">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">About</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Contact</a>
            </li>
        </ul>
    </nav>
    <div class="container mt-4 text-center">
        <h4 class="section-title">Scanning Files...</h4>
    </div>
    <div class="spinner-border text-light" role="status">
    </div>
    <div class="spinner-border text-dark" role="status">
    </div>
    <div class="spinner-border text-info" role="status">
    </div>
    <h4 class="section-title">Featured Files</h4>
    <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Documents</h5>
                        <p class="card-text">Personal documents.</p>
                        <a href="#" class="btn btn-success text-white">View Details</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Downloads</h5>
                        <p class="card-text">Downloaded files.</p>
                        <a href="#" class="btn btn-info text-white">View Details</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Images</h5>
                        <p class="card-text">Downloaded images.</p>
                        <a href="#" class="btn btn-warning text-white">View Details</a>
                    </div>
                </div>
            </div>
        </div>
     </div>
</div>
 <div class="section-title">Browse more files</div>
    <ul class="pagination">
        <li class="page-item"><a class="page-link bg-success text-white" href="#">Previous</a></li>
        <li class="page-item"><a class="page-link bg-info text-dark" href="#">1</a></li>
        <li class="page-item"><a class="page-link bg-info text-dark" href="#">2</a></li>
        <li class="page-item"><a class="page-link bg-info text-dark" href="#">3</a></li>
        <li class="page-item"><a class="page-link bg-primary text-white" href="#">Next</a></li>
    </ul>
</body>
</html>
